<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoodRadar · Cardápios completos e preços transparentes</title>
<meta name="description" content="Descubra restaurantes perto de você com o cardápio inteiro e o preço de cada prato, antes de sair de casa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/styles.css">
<script>
/* Aplica o tema ANTES da primeira pintura — sem isso a página
   pisca branca antes de virar escura. Precisa ficar no <head>. */
(function () {
  try {
    var t = localStorage.getItem("foodradar:theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  } catch (e) { /* modo privado: fica no padrão do sistema */ }
})();
</script>
</head>
<body>

<header class="site-header" id="siteHeader">
  <div class="container header-inner">
    <a class="logo" href="#/" aria-label="FoodRadar — início">
      <span class="logo-mark">FR</span>
      <span class="logo-text">FoodRadar</span>
    </a>

    <form class="header-search" id="headerSearchForm" role="search">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="headerSearchInput" type="search" placeholder="Buscar restaurante, prato ou cozinha" autocomplete="off" aria-label="Buscar">
    </form>

    <button class="theme-btn" id="themeBtn" type="button" aria-label="Alternar tema" title="Alternar tema claro/escuro">
      <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"/></svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
    </button>

    <div class="loc-wrap">
      <button class="loc-chip" id="locChip" type="button" aria-haspopup="dialog" aria-expanded="false" title="Mudar localização">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.4 7-11a7 7 0 1 0-14 0c0 4.6 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
        <span id="locLabel">São Paulo, SP</span>
        <svg class="icon loc-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>

      <div class="loc-pop" id="locPop" hidden role="dialog" aria-label="Escolher localização">
        <button class="loc-gps" id="locGps" type="button">
          <span class="loc-gps-ico">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8"/><path d="M12 1.5V4M12 20v2.5M1.5 12H4M20 12h2.5"/></svg>
          </span>
          <span class="loc-gps-txt">
            <strong>Usar minha localização atual</strong>
            <small>Restaurantes mais perto de onde você está</small>
          </span>
        </button>

        <div class="loc-div"><span>ou busque um lugar</span></div>

        <div class="loc-field">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="locInput" type="text" placeholder="Cidade, bairro ou endereço" autocomplete="off" spellcheck="false">
        </div>

        <ul class="loc-list" id="locList"></ul>
        <p class="loc-hint" id="locHint" hidden></p>
      </div>
    </div>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<footer class="site-footer">
  <div class="container footer-inner">
    <div>
      <div class="logo logo--footer"><span class="logo-mark">FR</span><span class="logo-text">FoodRadar</span></div>
      <p class="footer-tag">Cardápios completos. Preços transparentes.</p>
    </div>
    <p class="footer-note">Protótipo · dados de demonstração. Localização, horários e fotos podem vir do Google Maps quando uma API key é configurada em <code>js/config.js</code>.</p>
  </div>
</footer>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/maps.js"></script>
<script src="js/osm.js"></script>
<script src="js/app.js"></script>
</body>
</html>
