<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoodRadar · Cardápios completos e preços transparentes</title>
<meta name="description" content="Descubra restaurantes perto de você com o cardápio inteiro e o preço de cada prato, antes de sair de casa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* ============================================================
   FoodRadar — design system
   ============================================================ */
/* ------------------------------------------------------------
   Tema
   O padrão segue o sistema (prefers-color-scheme). O botão do
   header grava uma escolha explícita em data-theme, que ganha
   do sistema nos dois sentidos.
   Regra: toda cor nasce aqui no :root claro; os blocos escuros
   só REDEFINEM tokens, nunca introduzem cor nova.
   ------------------------------------------------------------ */
:root{
  color-scheme:light;

  --brand:#2563eb;
  --brand-dark:#1d4ed8;
  --brand-soft:#eef3ff;
  --on-brand:#ffffff;
  --brand-2:#4f9cff;
  --brand-glow:rgba(37,99,235,.45);
  --price:#2563eb;
  --ink:#15181d;
  --ink-2:#3d434e;
  --muted:#6b7280;
  --muted-2:#9aa1ad;
  --line:#e9ebef;
  --line-2:#f1f3f5;
  --bg:#f4f5f7;
  --card:#ffffff;
  --surface-2:#fafbfc;
  --hover-2:#e6e9ee;
  --star:#f7b500;
  --green:#1f9d55;

  /* superfícies compostas */
  --header-bg:rgba(255,255,255,.92);
  --overlay:rgba(255,255,255,.95);
  --hero-top:#ffffff;

  /* botões/pílulas que invertem em relação ao fundo */
  --invert-bg:#15181d;
  --invert-fg:#ffffff;

  /* avisos e selos */
  --warn-bg:#fffaf2;
  --warn-line:#f0d9b5;
  --warn-ink:#a8701a;
  --veg-bg:#e8f6ed;
  --veg-fg:#1f9d55;

  /* mapa */
  --map-bg:#e7ebf0;
  --map-bg-2:#dde3ea;
  --map-grid:rgba(255,255,255,.7);
  --tile-filter:none;

  /* gradiente do placeholder de foto (matiz vem do JS) */
  --ph-s:45%;
  --ph-l1:88%;
  --ph-l2:80%;

  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 4px 16px rgba(16,24,40,.07);
  --shadow-lg:0 12px 40px rgba(16,24,40,.12);
  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:22px;
  --container:1120px;
}

/* Paleta escura — aplicada quando o sistema pede E o usuário não
   escolheu "claro" explicitamente. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;

    --brand:#6ea8ff;
    --brand-dark:#8dbcff;
    --brand-soft:#16233a;
    --on-brand:#06142e;
    --brand-2:#9dc5ff;
    --brand-glow:rgba(110,168,255,.4);
    --price:#6ea8ff;
    --ink:#eef1f6;
    --ink-2:#c2c9d6;
    --muted:#949cab;
    --muted-2:#6d7482;
    --line:#272c36;
    --line-2:#1d212a;
    --bg:#0f1116;
    --card:#171b22;
    --surface-2:#1b1f27;
    --hover-2:#272c36;
    --star:#f7b500;
    --green:#3ac07d;

    --header-bg:rgba(15,17,22,.92);
    --overlay:rgba(23,27,34,.92);
    --hero-top:#171b22;

    --invert-bg:#eef1f6;
    --invert-fg:#0f1116;

    --warn-bg:#241c10;
    --warn-line:#4a3a1c;
    --warn-ink:#e0ae5c;
    --veg-bg:#14301f;
    --veg-fg:#3ac07d;

    --map-bg:#1b2029;
    --map-bg-2:#141821;
    --map-grid:rgba(255,255,255,.06);
    --tile-filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.92) saturate(.85);

    --ph-s:26%;
    --ph-l1:26%;
    --ph-l2:19%;

    --shadow-sm:0 1px 2px rgba(0,0,0,.35);
    --shadow:0 4px 16px rgba(0,0,0,.45);
    --shadow-lg:0 12px 40px rgba(0,0,0,.6);
  }
}

/* Escolha explícita pelo botão — ganha do sistema. */
:root[data-theme="dark"]{
  color-scheme:dark;

  --brand:#6ea8ff;
  --brand-dark:#8dbcff;
  --brand-soft:#16233a;
  --on-brand:#06142e;
  --brand-2:#9dc5ff;
  --brand-glow:rgba(110,168,255,.4);
  --price:#6ea8ff;
  --ink:#eef1f6;
  --ink-2:#c2c9d6;
  --muted:#949cab;
  --muted-2:#6d7482;
  --line:#272c36;
  --line-2:#1d212a;
  --bg:#0f1116;
  --card:#171b22;
  --surface-2:#1b1f27;
  --hover-2:#272c36;
  --star:#f7b500;
  --green:#3ac07d;

  --header-bg:rgba(15,17,22,.92);
  --overlay:rgba(23,27,34,.92);
  --hero-top:#171b22;

  --invert-bg:#eef1f6;
  --invert-fg:#0f1116;

  --warn-bg:#241c10;
  --warn-line:#4a3a1c;
  --warn-ink:#e0ae5c;
  --veg-bg:#14301f;
  --veg-fg:#3ac07d;

  --map-bg:#1b2029;
  --map-bg-2:#141821;
  --map-grid:rgba(255,255,255,.06);
  --tile-filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.92) saturate(.85);

  --ph-s:26%;
  --ph-l1:26%;
  --ph-l2:19%;

  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow:0 4px 16px rgba(0,0,0,.45);
  --shadow-lg:0 12px 40px rgba(0,0,0,.6);
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--ink);
  background:var(--bg);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit}
a{color:inherit;text-decoration:none}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:var(--line-2);padding:1px 5px;border-radius:5px}

.container{width:100%;max-width:var(--container);margin:0 auto;padding:0 24px}
.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================ Header ============================ */
.site-header{
  position:sticky;top:0;z-index:60;
  background:var(--header-bg);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
}
.header-inner{display:flex;align-items:center;gap:16px;height:64px}
.logo{display:flex;align-items:center;gap:9px;flex:none}
.logo-mark{
  width:32px;height:32px;border-radius:10px;
  background:linear-gradient(140deg,var(--brand),var(--brand-2));
  color:#fff;font-weight:800;font-size:13px;letter-spacing:-.02em;
  display:grid;place-items:center;
}
.logo-text{font-weight:800;font-size:19px;letter-spacing:-.025em}
.logo--footer .logo-mark{width:28px;height:28px;font-size:11.5px}

/* botão de tema claro/escuro */
.theme-btn{
  width:38px;height:38px;flex:none;border-radius:999px;
  border:1px solid var(--line);background:var(--card);color:var(--ink-2);
  display:grid;place-items:center;
  transition:border-color .15s,color .15s;
}
.theme-btn:hover{border-color:var(--muted-2);color:var(--ink)}
.theme-btn .icon{width:17px;height:17px;grid-area:1/1}
/* mostra o ícone do tema que o clique VAI aplicar */
.theme-btn .icon-sun{display:none}
.theme-btn .icon-moon{display:block}
:root[data-theme="dark"] .theme-btn .icon-sun{display:block}
:root[data-theme="dark"] .theme-btn .icon-moon{display:none}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .theme-btn .icon-sun{display:block}
  :root:not([data-theme="light"]) .theme-btn .icon-moon{display:none}
}

.header-search{
  flex:1;max-width:520px;
  display:flex;align-items:center;gap:9px;
  background:var(--bg);border:1px solid transparent;
  border-radius:999px;padding:0 16px;height:40px;
  transition:border-color .15s,background .15s;
}
.header-search:focus-within{background:var(--card);border-color:var(--ink);box-shadow:0 0 0 3px rgba(21,24,29,.06)}
.header-search .icon{color:var(--muted-2)}
.header-search input{flex:1;border:0;background:none;outline:none;font-size:14px;min-width:0}
.header-search input::-webkit-search-cancel-button{-webkit-appearance:none}

.loc-chip{
  display:flex;align-items:center;gap:6px;flex:none;
  font-size:13.5px;font-weight:600;color:var(--ink-2);
  padding:8px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);transition:border-color .15s,color .15s;
  max-width:210px;
}
.loc-chip:hover{border-color:var(--muted-2)}
.loc-chip .icon{color:var(--brand);width:16px;height:16px}
.loc-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc-chip.is-loading{opacity:.6;pointer-events:none}
.loc-chip .loc-caret{color:var(--muted-2);width:14px;height:14px;transition:transform .18s}
.loc-chip[aria-expanded="true"]{border-color:var(--ink)}
.loc-chip[aria-expanded="true"] .loc-caret{transform:rotate(180deg)}

/* ---------------- seletor de localização ---------------- */
.loc-wrap{position:relative;flex:none}
.loc-pop{
  position:absolute;right:0;top:calc(100% + 10px);width:340px;z-index:80;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg);padding:10px;
  animation:locIn .16s ease-out;
}
@keyframes locIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

.loc-gps{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:11px 12px;border-radius:var(--r);transition:background .15s;
}
.loc-gps:hover{background:var(--brand-soft)}
.loc-gps-ico{
  width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--brand-soft);color:var(--brand);
}
.loc-gps-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.loc-gps-txt strong{font-size:13.8px;font-weight:650}
.loc-gps-txt small{font-size:12px;color:var(--muted)}

.loc-div{display:flex;align-items:center;gap:10px;margin:10px 2px 9px;color:var(--muted-2);font-size:11.5px;font-weight:600}
.loc-div::before,.loc-div::after{content:"";flex:1;height:1px;background:var(--line)}

.loc-field{
  display:flex;align-items:center;gap:9px;height:40px;padding:0 13px;
  background:var(--bg);border:1px solid transparent;border-radius:var(--r);
  transition:border-color .15s,background .15s;
}
.loc-field:focus-within{background:var(--card);border-color:var(--ink)}
.loc-field .icon{color:var(--muted-2);width:16px;height:16px}
.loc-field input{flex:1;border:0;background:none;outline:none;font-size:14px;min-width:0}

.loc-list{list-style:none;margin:6px 0 0;padding:0;max-height:246px;overflow-y:auto}
.loc-list:empty{margin:0}
.loc-list button{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:9px 12px;border-radius:var(--r-sm);transition:background .12s;
}
.loc-list button:hover,.loc-list button:focus-visible{background:var(--line-2);outline:none}
.loc-list .icon{color:var(--muted-2);width:16px;height:16px}
.loc-opt-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.loc-opt-main{font-size:13.8px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc-opt-sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc-opt-count{margin-left:auto;font-size:11.5px;font-weight:650;color:var(--green);flex:none}

.loc-empty{padding:14px 12px;font-size:13px;color:var(--muted-2);text-align:center}
.loc-hint{margin:9px 4px 3px;font-size:11.8px;color:var(--muted-2);line-height:1.45}

/* ============================ Home hero ============================ */
.hero{
  background:linear-gradient(180deg,var(--hero-top) 0%,var(--bg) 100%);
  border-bottom:1px solid var(--line);
  padding:52px 0 36px;
}
.hero h1{
  margin:0 0 10px;font-size:38px;line-height:1.15;letter-spacing:-.035em;font-weight:800;max-width:16ch;
}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero p{margin:0 0 26px;color:var(--muted);font-size:16.5px;max-width:52ch}
.hero-search{
  display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-xl);
  padding:7px 7px 7px 18px;box-shadow:var(--shadow);max-width:660px;
}
.hero-search .icon{color:var(--muted-2);width:20px;height:20px}
.hero-search input{flex:1;border:0;outline:none;background:none;font-size:15.5px;height:42px;min-width:0}
.hero-search button{
  flex:none;background:var(--brand);color:var(--on-brand);font-weight:650;font-size:14.5px;
  padding:0 22px;height:42px;border-radius:var(--r-lg);transition:background .15s;
}
.hero-search button:hover{background:var(--brand-dark)}
.hero-stats{display:flex;gap:26px;margin-top:20px;flex-wrap:wrap}
.hero-stat{font-size:13.5px;color:var(--muted)}
.hero-stat b{display:block;font-size:19px;color:var(--ink);font-weight:750;letter-spacing:-.02em}

/* ============================ Categories ============================ */
.section{padding:34px 0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:16px}
.section-head h2{margin:0;font-size:21px;font-weight:750;letter-spacing:-.025em}
.section-head .sub{color:var(--muted);font-size:13.5px}

.cats{display:flex;gap:10px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:thin}
.cats::-webkit-scrollbar{height:6px}
.cats::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.cat{
  flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;
  width:88px;padding:14px 6px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--line);
  transition:transform .15s,border-color .15s,box-shadow .15s;
}
.cat:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--line)}
.cat.is-active{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 1px var(--brand) inset}
.cat-emoji{font-size:24px;line-height:1}
.cat-name{font-size:12.5px;font-weight:600;color:var(--ink-2);text-align:center;line-height:1.25}

/* ============================ Filters ============================ */
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-size:13px;font-weight:600;color:var(--ink-2);
  transition:border-color .15s,background .15s,color .15s;
}
.chip:hover{border-color:var(--muted-2)}
.chip.is-active{background:var(--invert-bg);border-color:var(--invert-bg);color:var(--invert-fg)}
.chip .icon{width:15px;height:15px}
.filters-spacer{flex:1}
.select-wrap{position:relative;display:inline-flex;align-items:center}
.select-wrap select{
  appearance:none;-webkit-appearance:none;
  padding:7px 32px 7px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;outline:none;
}
.select-wrap .icon{position:absolute;right:10px;pointer-events:none;color:var(--muted-2);width:14px;height:14px}

/* ============================ Restaurant cards ============================ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px}
.rcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  overflow:hidden;display:flex;flex-direction:column;
  transition:transform .18s,box-shadow .18s,border-color .18s;
}
.rcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:transparent}
.rcard-media{position:relative;aspect-ratio:16/10;background:var(--line-2);overflow:hidden}
.rcard-media-link{display:block;position:relative;width:100%;height:100%}
.rcard-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s}
.rcard:hover .rcard-media img{transform:scale(1.045)}
/* O JS só informa a matiz (--ph-hue); saturação e luminosidade vêm
   do tema, senão os gradientes ficariam berrantes no escuro. */
.ph{
  position:absolute;inset:0;display:grid;place-items:center;font-size:40px;
  background:linear-gradient(140deg,
    hsl(var(--ph-hue,20) var(--ph-s) var(--ph-l1)),
    hsl(calc(var(--ph-hue,20) + 40) var(--ph-s) var(--ph-l2)));
}
.rcard-badge{
  position:absolute;left:12px;top:12px;
  background:var(--overlay);backdrop-filter:blur(4px);
  padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;
  display:flex;align-items:center;gap:5px;box-shadow:var(--shadow-sm);
}
.rcard-badge .icon{width:13px;height:13px;color:var(--star);fill:var(--star);stroke:none}
.rcard-badge .count{color:var(--muted);font-weight:500}
.rcard-open{
  position:absolute;right:12px;top:12px;
  padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:700;
  background:var(--overlay);backdrop-filter:blur(4px);box-shadow:var(--shadow-sm);
}
.rcard-open.is-open{color:var(--green)}
.rcard-open.is-closed{color:var(--muted)}
.rcard-fav{
  position:absolute;right:12px;bottom:12px;width:34px;height:34px;border-radius:50%;
  background:var(--overlay);display:grid;place-items:center;
  box-shadow:var(--shadow-sm);color:var(--ink-2);transition:color .15s,transform .15s;
}
.rcard-fav:hover{transform:scale(1.08)}
.rcard-fav.is-on{color:var(--brand)}
.rcard-fav.is-on .icon{fill:var(--brand)}

.rcard-body{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1}
.rcard-title{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.rcard-title h3{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.02em}
.rcard-meta{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.dot{width:3px;height:3px;border-radius:50%;background:var(--muted-2);flex:none}
.price-level{font-weight:700;letter-spacing:.5px}
.price-level .on{color:var(--green)}
.price-level .off{color:var(--line)}

.rcard-dishes{
  margin:13px 0 0;padding:11px 12px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--line-2);
}
.rcard-dish{display:flex;justify-content:space-between;gap:12px;font-size:12.8px;padding:2px 0}
.rcard-dish span:first-child{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rcard-dish span:last-child{color:var(--price);font-weight:700;flex:none}
.rcard-foot{
  margin-top:auto;padding-top:13px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:12.5px;color:var(--muted);
}
.rcard-avg b{color:var(--ink);font-weight:700}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{
  font-size:11.5px;font-weight:600;color:var(--ink-2);
  background:var(--line-2);padding:4px 9px;border-radius:999px;white-space:nowrap;
}

/* ---------------- catálogo aberto (OpenStreetMap) ---------------- */
.rcard--open{border-style:dashed}
.rcard--open .rcard-media{aspect-ratio:16/7}
.rcard-src{
  position:absolute;left:12px;top:12px;
  background:var(--overlay);backdrop-filter:blur(4px);
  padding:5px 10px;border-radius:999px;font-size:11px;font-weight:700;
  color:var(--muted);box-shadow:var(--shadow-sm);
}
.rcard-nomenu{
  margin-top:13px;padding:11px 12px;border-radius:var(--r-sm);
  background:var(--warn-bg);border:1px dashed var(--warn-line);
  display:flex;flex-direction:column;gap:3px;
}
.rcard-nomenu strong{font-size:12.8px;font-weight:700;color:var(--warn-ink)}
.rcard-nomenu span{font-size:12px;color:var(--muted);line-height:1.4}

.osm-note{
  margin:4px 0 18px;font-size:14px;color:var(--muted);
}
.osm-block{margin-top:34px}
.osm-head{margin-bottom:16px;padding-left:11px;border-left:3px solid var(--muted-2)}
.osm-head h3{margin:0;font-size:18px;font-weight:750;letter-spacing:-.02em}
.osm-head p{margin:2px 0 0;font-size:13px;color:var(--muted)}

.osm-error{
  display:flex;flex-direction:column;align-items:flex-start;gap:7px;
  padding:22px 24px;background:var(--card);border:1px dashed var(--line);border-radius:var(--r-lg);
}
.osm-error strong{font-size:15px;font-weight:700}
.osm-error span{font-size:13.5px;color:var(--muted);max-width:58ch;line-height:1.55}
.osm-error .btn{margin-top:6px}

.src-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:12px;font-weight:650;color:var(--muted);
  background:var(--line-2);padding:4px 9px;border-radius:999px;
}
.src-badge .icon{width:13px;height:13px;color:var(--muted-2)}

.nomenu-panel{text-align:center;padding:44px 34px}
.nomenu-ico{
  width:52px;height:52px;border-radius:50%;margin:0 auto 16px;
  background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;
}
.nomenu-ico .icon{width:24px;height:24px}
.nomenu-panel h2{margin:0 0 10px}
.nomenu-panel p{margin:0 auto 22px;max-width:52ch;color:var(--muted);font-size:14.5px;line-height:1.6}
.nomenu-panel strong{color:var(--ink)}
.nomenu-cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.empty{
  text-align:center;padding:70px 20px;background:var(--card);border:1px dashed var(--line);border-radius:var(--r-lg);
}
.empty .big{font-size:38px;margin-bottom:10px}
.empty h3{margin:0 0 6px;font-size:18px}
.empty p{margin:0 0 18px;color:var(--muted)}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--invert-bg);color:var(--invert-fg);font-weight:650;font-size:14px;
  padding:10px 18px;border-radius:var(--r);transition:opacity .15s;
}
.btn:hover{opacity:.88}
.btn--ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn--brand{background:var(--brand)}
.btn--brand:hover{background:var(--brand-dark);opacity:1}

/* ============================ Restaurant page ============================ */
.rhero{height:280px;position:relative;overflow:hidden;background:var(--map-bg)}
.rhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rhero .ph{font-size:76px}
.rhero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,0) 45%)}
.rhero-back{
  position:absolute;left:24px;top:20px;z-index:3;
  display:inline-flex;align-items:center;gap:7px;
  background:var(--overlay);backdrop-filter:blur(6px);
  padding:8px 15px;border-radius:999px;font-size:13.5px;font-weight:650;
  box-shadow:var(--shadow-sm);
}
.rhero-back:hover{background:var(--card)}

.rwrap{margin-top:-72px;position:relative;z-index:2;padding-bottom:56px}

.rhead{
  background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);
  padding:26px 28px;display:flex;gap:20px;align-items:flex-start;
}
.rhead-main{flex:1;min-width:0}
.rhead h1{margin:0 0 9px;font-size:29px;font-weight:800;letter-spacing:-.035em}
.rhead-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:12px}
.stars{position:relative;display:inline-block;line-height:0;flex:none}
.stars-bg,.stars-fg{display:flex;gap:2px}
.stars-fg{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap}
.stars .icon{width:15px;height:15px;stroke:none;fill:var(--line);flex:none}
.stars-fg .icon{fill:var(--star)}
.rating-num{font-weight:700;color:var(--ink);margin-left:5px}
.rating-count{color:var(--muted)}
.rhead-desc{margin:0 0 14px;color:var(--ink-2);font-size:14.5px;max-width:70ch}
.rhead-actions{display:flex;gap:8px;flex:none}
.icon-btn{
  width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink-2);background:var(--card);
  transition:border-color .15s,color .15s,transform .15s;
}
.icon-btn:hover{border-color:var(--muted-2);transform:translateY(-1px)}
.icon-btn.is-on{color:var(--brand);border-color:var(--brand)}
.icon-btn.is-on .icon{fill:var(--brand)}

.rbody{display:grid;grid-template-columns:1fr 340px;gap:22px;margin-top:22px;align-items:start}
.panel{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);border:1px solid var(--line);padding:24px 26px}
.panel--flush{padding:0}
.panel h2{margin:0 0 4px;font-size:21px;font-weight:750;letter-spacing:-.025em}

/* menu */
.menu-nav{display:flex;gap:7px;overflow-x:auto;margin:16px 0 4px;padding-bottom:8px}
.menu-nav a{
  flex:none;font-size:12.5px;font-weight:600;color:var(--ink-2);
  padding:6px 12px;border-radius:999px;background:var(--line-2);
}
.menu-nav a:hover{background:var(--hover-2)}
.msection{margin-top:26px;scroll-margin-top:90px}
.msection-head{display:flex;align-items:baseline;gap:9px;border-left:3px solid var(--brand);padding-left:11px;margin-bottom:6px}
.msection-head h3{margin:0;font-size:17.5px;font-weight:750;letter-spacing:-.02em}
.msection-head .count{font-size:12.5px;color:var(--muted-2)}
.mitem{display:flex;gap:18px;padding:15px 0;border-bottom:1px solid var(--line-2)}
.mitem:last-child{border-bottom:0;padding-bottom:2px}
.mitem-main{flex:1;min-width:0}
.mitem-name{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.mitem-name strong{font-size:14.8px;font-weight:650}
.mitem-desc{margin:0;font-size:13.2px;color:var(--muted);line-height:1.5}
.mitem-price{font-size:15.5px;font-weight:750;color:var(--price);white-space:nowrap;flex:none;letter-spacing:-.01em}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.02em;padding:3px 8px;border-radius:6px;background:var(--invert-bg);color:var(--invert-fg)}
.pill--veg{background:var(--veg-bg);color:var(--veg-fg)}
.pill--new{background:var(--brand-soft);color:var(--brand)}

/* sidebar */
.side-block{padding:20px 22px;border-bottom:1px solid var(--line-2)}
.side-block:last-child{border-bottom:0}
.side-title{display:flex;align-items:center;gap:9px;margin:0 0 9px;font-size:15.5px;font-weight:700;letter-spacing:-.02em}
.side-title .icon{color:var(--brand);width:17px;height:17px}
.side-block p{margin:0;font-size:13.8px;color:var(--ink-2);line-height:1.55}
.side-sub{color:var(--muted-2);font-size:12.8px;margin-top:3px}
.side-label{font-size:13px;font-weight:700;margin:0 0 5px}

.map-box{
  height:150px;border-radius:var(--r);overflow:hidden;margin-bottom:13px;
  background:var(--map-bg);position:relative;border:1px solid var(--line);
  /* prende as camadas do Leaflet (z-index até 800) dentro do card,
     senão elas passam por cima do header fixo ao rolar a página */
  z-index:0;isolation:isolate;
}
/* Leaflet / OpenStreetMap */
.map-box.leaflet-container{background:var(--map-bg);font:inherit}
/* Os tiles do OSM são claros; no tema escuro eles são invertidos
   para não virarem um retângulo branco no meio do card.

   O filtro vai no PAINEL de tiles, não em cada <img>: o CSS do
   Leaflet declara `.leaflet-tile{filter:inherit}` justamente para
   que o filtro desça do contêiner. Uma regra direta na imagem tem a
   mesma especificidade e ainda perde por ordem de cascata, porque o
   CSS do Leaflet é injetado depois deste arquivo.

   O painel só contém tiles — marcador e atribuição estão em outros
   painéis e ficam de fora da inversão. */
.map-box .leaflet-tile-pane{filter:var(--tile-filter)}
.leaflet-div-icon.fr-pin{background:none;border:0}
.map-box .leaflet-control-attribution{
  font-size:9.5px;padding:1px 5px;background:var(--overlay);
  color:var(--muted);border-radius:4px 0 0 0;
}
.map-box .leaflet-control-attribution a{color:var(--muted-2);text-decoration:underline}
.map-box .map-fallback{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;
  background:
    linear-gradient(90deg,var(--map-grid) 1px,transparent 1px) 0 0/28px 28px,
    linear-gradient(var(--map-grid) 1px,transparent 1px) 0 0/28px 28px,
    linear-gradient(150deg,var(--map-bg),var(--map-bg-2));
}
.map-pin{width:34px;height:34px;border-radius:50%;background:var(--brand);display:grid;place-items:center;color:var(--on-brand);box-shadow:0 4px 14px var(--brand-glow)}
.map-pin .icon{width:18px;height:18px;stroke-width:2.2}

.hours-list{margin:6px 0 0;padding:0;list-style:none;font-size:13.2px}
.hours-list li{display:flex;justify-content:space-between;gap:12px;padding:4px 0;color:var(--ink-2)}
.hours-list li.today{font-weight:700;color:var(--ink)}
.hours-list li .closed{color:var(--muted-2);font-weight:500}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13.2px;font-weight:700}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.status.open{color:var(--green)}
.status.closed{color:var(--muted)}
.hours-toggle{font-size:12.5px;font-weight:650;color:var(--brand);margin-top:8px}

.avg-row{display:flex;align-items:baseline;gap:8px}
.avg-row .big{font-size:19px;font-weight:750;letter-spacing:-.02em}
.facilities{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.fac{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--line-2);padding:5px 10px;border-radius:999px}
.fac .icon{width:14px;height:14px;color:var(--muted)}

.side-cta{display:flex;flex-direction:column;gap:8px;padding:18px 22px}
.side-cta .btn{justify-content:center;width:100%}

.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
  background:var(--invert-bg);color:var(--invert-fg);padding:11px 20px;border-radius:999px;
  font-size:13.5px;font-weight:600;box-shadow:var(--shadow-lg);
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:200;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============================ Footer ============================ */
.site-footer{background:var(--card);border-top:1px solid var(--line);margin-top:20px}
.footer-inner{display:flex;justify-content:space-between;align-items:center;gap:24px;padding-top:26px;padding-bottom:26px;flex-wrap:wrap}
.footer-tag{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.footer-note{margin:0;color:var(--muted-2);font-size:12.3px;max-width:46ch;text-align:right}

/* ============================ Responsive ============================ */
@media (max-width:960px){
  .rbody{grid-template-columns:1fr}
  .hero h1{font-size:31px}
  .footer-note{text-align:left}
}
@media (max-width:720px){
  .container{padding:0 16px}
  .header-search{display:none}
  .loc-chip{max-width:170px}
  .loc-pop{width:min(340px,calc(100vw - 32px))}
  .hero{padding:34px 0 26px}
  .hero h1{font-size:26px;max-width:none}
  .hero p{font-size:15px}
  .hero-search{padding-left:14px}
  .hero-search button{padding:0 15px}
  .rhero{height:200px}
  .rwrap{margin-top:-48px}
  .rhead{flex-direction:column;padding:20px}
  .rhead h1{font-size:24px}
  .panel{padding:20px 18px}
  .grid{grid-template-columns:1fr}
}

<script>
/* ---- js/config.js ---- */
/* ============================================================
   FoodRadar — configuração
   ------------------------------------------------------------
   Para ligar o Google Maps (mapa real, foto do lugar, horário
   oficial e endereço), cole sua chave em GOOGLE_MAPS_API_KEY.

   No Google Cloud Console habilite:
     - Maps JavaScript API   (renderizar o mapa)
     - Places API (New)      (detalhes, horários, fotos, nota)
     - Geocoding API         (endereço a partir da localização)

   Sem chave o app funciona 100% com os dados locais de
   js/data.js — só o mapa vira um placeholder com link para o
   Google Maps.
   ============================================================ */
window.FR_CONFIG = {
  GOOGLE_MAPS_API_KEY: "",

  // Quem desenha o mapa da página do restaurante:
  //   "auto"   → Google se houver API key, senão OpenStreetMap
  //   "osm"    → sempre OpenStreetMap (Leaflet) — grátis, sem chave, sem cartão
  //   "google" → sempre Google (exige a API key acima)
  //   "none"   → sem mapa, só o placeholder
  MAP_PROVIDER: "auto",

  // Centro padrão quando o usuário não libera a localização.
  DEFAULT_LOCATION: { lat: -23.5613, lng: -46.6565, label: "São Paulo, SP" },

  // Raio considerado "por perto" a partir do ponto escolhido (km).

  NEARBY_RADIUS_KM: 30,

  CURRENCY: { locale: "pt-BR", code: "BRL" }
};

   ------------------------------------------------------------

   não fornece item de cardápio com preço — isso é conteúdo
   próprio da plataforma.

   Formato de horário: 7 posições, 0 = domingo … 6 = sábado.
   Cada dia é um array de faixas "HH:MM-HH:MM" ou null (fechado).
   ============================================================ */

window.CATEGORIES = [

  { id: "doces",         name: "Doces",         emoji: "\u{1F370}" }
];

/* Facilidades — rótulo + ícone (chave usada em js/app.js) */
window.FACILITIES = {
  wifi:       { label: "WiFi gratuito",     icon: "wifi" },
  parking:    { label: "Estacionamento",    icon: "parking" },
  ac:         { label: "Ar-condicionado",   icon: "snow" },

  kids:       { label: "Espaço kids",       icon: "kids" },
  bar:        { label: "Bar completo",      icon: "glass" },
  music:      { label: "Música ao vivo",    icon: "music" },
  cards:      { label: "Aceita cartão",     icon: "card" }
};

   Serve para o texto de "nenhum restaurante por aqui" sugerir

window.CITY_INFO = {

  "rio-de-janeiro": { label: "Rio de Janeiro, RJ", coords: { lat: -22.9711, lng: -43.1822 } },

  { name: "Manaus", uf: "AM", coords: { lat: -3.1019, lng: -60.025 } },
  { name: "Belém", uf: "PA", coords: { lat: -1.4558, lng: -48.5044 } },

/* ---- js/maps.js ---- */
/* ============================================================
   FoodRadar — adaptador do Google Maps
   ------------------------------------------------------------
   Tudo aqui é OPCIONAL e degrada com elegância: sem API key
   (ou com a rede fora), o app continua funcionando com os
   dados locais e o mapa vira um placeholder clicável.

   O que o Google entrega de verdade:
     ✔ coordenadas, endereço formatado, mapa e rota
     ✔ horário de funcionamento oficial + "aberto agora"
     ✔ fotos do lugar, nota e nº de avaliações
     ✘ cardápio item a item com preço  → isso é dado NOSSO
   ============================================================ */
(function (global) {
  "use strict";

  var CFG = global.FR_CONFIG || {};
  var loadPromise = null;

  function hasKey() {
    return typeof CFG.GOOGLE_MAPS_API_KEY === "string" && CFG.GOOGLE_MAPS_API_KEY.trim().length > 0;
  }

  /* ---------- carregamento sob demanda da Maps JavaScript API ---------- */
  function load() {
    if (!hasKey()) return Promise.reject(new Error("sem-api-key"));
    if (loadPromise) return loadPromise;

    loadPromise = new Promise(function (resolve, reject) {
      if (global.google && global.google.maps) return resolve(global.google.maps);

      var cbName = "__frMapsReady";
      var timer = setTimeout(function () { reject(new Error("timeout")); }, 12000);

      global[cbName] = function () {
        clearTimeout(timer);
        resolve(global.google.maps);
      };

      var s = document.createElement("script");
      s.async = true;
      s.src = "https://maps.googleapis.com/maps/api/js" +
        "?key=" + encodeURIComponent(CFG.GOOGLE_MAPS_API_KEY) +
        "&v=weekly&libraries=places,marker&loading=async&language=pt-BR&region=BR" +
        "&callback=" + cbName;
      s.onerror = function () { clearTimeout(timer); reject(new Error("script-error")); };
      document.head.appendChild(s);
    }).catch(function (err) {
      loadPromise = null;
      throw err;
    });

    return loadPromise;
  }

  /* ---------- distância (não precisa de API) ---------- */
  function haversineKm(a, b) {
    if (!a || !b) return null;
    var R = 6371;
    var dLat = (b.lat - a.lat) * Math.PI / 180;
    var dLng = (b.lng - a.lng) * Math.PI / 180;
    var la1 = a.lat * Math.PI / 180, la2 = b.lat * Math.PI / 180;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.sin(dLng / 2) * Math.sin(dLng / 2) * Math.cos(la1) * Math.cos(la2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  function formatDistance(km) {
    if (km == null) return "";
    var meters = Math.round(km * 1000 / 50) * 50;
    if (meters < 1000) return meters + " m";
    return (meters / 1000).toFixed(1).replace(".", ",") + " km";
  }

  /* ---------- localização do usuário ---------- */
  function getUserLocation() {
    return new Promise(function (resolve, reject) {
      if (!navigator.geolocation) return reject(new Error("sem-geolocation"));
      navigator.geolocation.getCurrentPosition(
        function (pos) { resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }); },
        function (err) { reject(err); },
        { enableHighAccuracy: false, timeout: 9000, maximumAge: 300000 }
      );
    });
  }

  /* ---------- nome do bairro a partir das coordenadas ---------- */
  function reverseGeocode(coords) {
    return load().then(function (maps) {
      var geocoder = new maps.Geocoder();
      return geocoder.geocode({ location: coords }).then(function (res) {
        var r = res.results && res.results[0];
        if (!r) return null;
        var pick = function (type) {
          var c = (r.address_components || []).find(function (x) { return x.types.indexOf(type) >= 0; });
          return c ? c.short_name : null;
        };
        var bairro = pick("sublocality_level_1") || pick("sublocality") || pick("administrative_area_level_2");
        var uf = pick("administrative_area_level_1");
        return bairro ? (uf ? bairro + ", " + uf : bairro) : r.formatted_address;
      });
    });
  }

  /* ---------- mapa embutido (ou placeholder) ---------- */
  var PIN_SVG =
    '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">' +
    '<path d="M12 21s7-6.4 7-11a7 7 0 1 0-14 0c0 4.6 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>';

  function renderFallback(el) {
    el.innerHTML = '<div class="map-fallback"><div class="map-pin">' + PIN_SVG + "</div></div>";
  }

  /* ---------- Leaflet + OpenStreetMap ----------
     Sem chave, sem cartão, sem cota. Carregado sob demanda:
     quem nunca abre uma página de restaurante não baixa nada.  */
  var LEAFLET = {
    css: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css",
    js: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"
  };
  var leafletPromise = null;

  function loadLeaflet() {
    if (leafletPromise) return leafletPromise;

    leafletPromise = new Promise(function (resolve, reject) {
      if (global.L && global.L.map) return resolve(global.L);

      var link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = LEAFLET.css;
      document.head.appendChild(link);

      var timer = setTimeout(function () { reject(new Error("timeout")); }, 12000);
      var s = document.createElement("script");
      s.async = true;
      s.src = LEAFLET.js;
      s.onload = function () {
        clearTimeout(timer);
        if (global.L && global.L.map) resolve(global.L);
        else reject(new Error("sem-leaflet"));
      };
      s.onerror = function () { clearTimeout(timer); reject(new Error("script-error")); };
      document.head.appendChild(s);
    }).catch(function (err) {
      leafletPromise = null;
      throw err;
    });

    return leafletPromise;
  }

  /* Qual motor desenha o mapa. */
  function mapProvider() {
    var p = CFG.MAP_PROVIDER || "auto";
    if (p === "auto") return hasKey() ? "google" : "osm";
    if (p === "google" && !hasKey()) return "osm";   // pediu Google sem chave
    return p;
  }

  var activeMap = null;   // só um mapa vivo por vez — evita listener vazando

  function destroyActiveMap() {
    if (activeMap && typeof activeMap.remove === "function") {
      try { activeMap.remove(); } catch (e) { /* já foi embora com o DOM */ }
    }
    activeMap = null;
  }

  function renderGoogleMap(el, coords, title) {
    return load().then(function (maps) {
      el.innerHTML = "";
      var map = new maps.Map(el, {
        center: coords,
        zoom: 16,
        disableDefaultUI: true,
        gestureHandling: "cooperative",
        clickableIcons: false
      });
      new maps.Marker({ position: coords, map: map, title: title || "" });
    });
  }

  function renderOsmMap(el, coords, title) {
    return loadLeaflet().then(function (L) {
      destroyActiveMap();
      el.innerHTML = "";

      var map = L.map(el, {
        zoomControl: false,        // 150px de altura não comporta o controle
        scrollWheelZoom: false,    // não sequestra a rolagem da página
        attributionControl: true   // atribuição do OSM é obrigatória (ODbL)
      }).setView([coords.lat, coords.lng], 16);

      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
      }).addTo(map);

      L.marker([coords.lat, coords.lng], {
        title: title || "",
        icon: L.divIcon({
          className: "fr-pin",
          html: '<span class="map-pin">' + PIN_SVG + "</span>",
          iconSize: [34, 34],
          iconAnchor: [17, 17]
        })
      }).addTo(map);

      activeMap = map;
      return map;
    });
  }

  function renderMap(el, coords, title) {
    if (!el) return;
    renderFallback(el);
    if (!coords) return;

    var which = mapProvider();
    if (which === "none") return;

    var job = which === "google"
      ? renderGoogleMap(el, coords, title)
      : renderOsmMap(el, coords, title);

    job.catch(function () { renderFallback(el); });
  }

  /* ---------- enriquecer um restaurante com dados do Places ---------- */
  /* Retorna um objeto só com os campos que o Google conseguiu preencher.
     O app faz o merge — dados locais continuam valendo como fallback.   */
  function enrich(restaurant) {
    if (!hasKey() || !restaurant) return Promise.resolve(null);

    return load().then(function (maps) {
      var Place = maps.places && maps.places.Place;
      if (!Place) return null;

      var fields = [
        "id", "displayName", "formattedAddress", "location",
        "rating", "userRatingCount", "priceLevel",
        "regularOpeningHours", "photos", "nationalPhoneNumber", "websiteURI"
      ];

      var query = restaurant.name + " " + (restaurant.address || "");
      return Place.searchByText({
        textQuery: query,
        fields: fields,
        language: "pt-BR",
        region: "br",
        maxResultCount: 1,
        locationBias: restaurant.coords ? { center: restaurant.coords, radius: 3000 } : undefined
      }).then(function (res) {
        var p = res && res.places && res.places[0];
        if (!p) return null;

        var out = { source: "google", placeId: p.id };
        if (p.formattedAddress) out.address = p.formattedAddress;
        if (p.location) out.coords = { lat: p.location.lat(), lng: p.location.lng() };
        if (typeof p.rating === "number") out.rating = p.rating;
        if (typeof p.userRatingCount === "number") out.reviews = p.userRatingCount;
        if (p.nationalPhoneNumber) out.phone = p.nationalPhoneNumber;
        if (p.websiteURI) out.website = p.websiteURI;

        if (p.regularOpeningHours) {
          out.hoursText = p.regularOpeningHours.weekdayDescriptions || null;
          if (typeof p.regularOpeningHours.isOpen === "function") {
            try { out.openNow = p.regularOpeningHours.isOpen(); } catch (e) { /* ignora */ }
          }
        }
        if (p.photos && p.photos.length) {
          try { out.photo = p.photos[0].getURI({ maxWidth: 1200 }); } catch (e) { /* ignora */ }
        }
        return out;
      });
    }).catch(function () { return null; });
  }

  /* ---------- autocomplete de lugares ----------
     Com API key: Places Autocomplete (qualquer cidade, bairro ou
     endereço do Brasil). Sem key: filtra a lista de js/data.js.   */
  var predictionCache = {};   // id -> objeto de predição do Google
  var sessionToken = null;

  function normalize(s) {
    return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  }

  function searchPlacesLocal(input) {
    var q = normalize(input).trim();
    if (!q) return [];
    var places = global.PLACES || [];
    return places
      .filter(function (p) { return normalize(p.name).indexOf(q) >= 0; })
      .sort(function (a, b) {
        // quem começa com o termo digitado aparece primeiro
        var ai = normalize(a.name).indexOf(q), bi = normalize(b.name).indexOf(q);
        return ai - bi || a.name.localeCompare(b.name);
      })
      .slice(0, 6)
      .map(function (p) {
        return {
          id: "local:" + p.name + "-" + p.uf,
          main: p.name,
          secondary: p.uf + ", Brasil",
          coords: p.coords
        };
      });
  }

  /* Photon (OpenStreetMap) — cobre o Brasil inteiro: cidade, bairro,
     rua. Sem chave, sem cartão. É o geocoder feito para type-ahead;
     o Nominatim proíbe esse uso na política dele.                    */
  var PHOTON = "https://photon.komoot.io/api/";

  // ruído que não serve como ponto de partida (entrada de metrô, etc.)
  var PHOTON_KEYS = ["place", "boundary", "highway", "building", "addr", "landuse"];

  function searchPlacesPhoton(input) {
    var url = PHOTON + "?q=" + encodeURIComponent(input) + "&limit=12";

    return fetch(url).then(function (res) {
      if (!res.ok) throw new Error("http-" + res.status);
      return res.json();
    }).then(function (data) {
      var seen = {};

      return (data.features || [])
        .filter(function (f) {
          var p = f.properties || {};
          if (p.countrycode !== "BR") return false;
          return PHOTON_KEYS.indexOf(p.osm_key) >= 0;
        })
        .map(function (f) {
          var p = f.properties;
          var c = f.geometry.coordinates;     // [lng, lat]

          // "Vila Mariana" / "São Paulo, SP, Brasil"
          var tail = [];
          if (p.city && p.city !== p.name) tail.push(p.city);
          if (p.state && p.state !== p.name) tail.push(p.state);
          tail.push("Brasil");

          return {
            id: "photon:" + p.osm_type + p.osm_id,
            main: p.name || p.street || p.city,
            secondary: tail.join(", "),
            coords: { lat: c[1], lng: c[0] }
          };
        })
        .filter(function (s) {
          if (!s.main) return false;
          var k = (s.main + "|" + s.secondary).toLowerCase();
          if (seen[k]) return false;
          seen[k] = true;
          return true;
        })
        .slice(0, 6);
    }).catch(function () {
      return searchPlacesLocal(input);       // rede fora: lista local
    });
  }

  function searchPlaces(input) {
    if (!hasKey()) return searchPlacesPhoton(input);

    return load().then(function (maps) {
      var AS = maps.places && maps.places.AutocompleteSuggestion;
      if (!AS) return searchPlacesLocal(input);

      if (!sessionToken) sessionToken = new maps.places.AutocompleteSessionToken();

      return AS.fetchAutocompleteSuggestions({
        input: input,
        includedRegionCodes: ["br"],
        language: "pt-BR",
        region: "br",
        sessionToken: sessionToken
      }).then(function (res) {
        return (res.suggestions || []).slice(0, 6).map(function (s) {
          var p = s.placePrediction;
          predictionCache[p.placeId] = p;
          return {
            id: p.placeId,
            main: p.mainText ? p.mainText.text : p.text.text,
            secondary: p.secondaryText ? p.secondaryText.text : "",
            coords: null              // resolvido só quando a pessoa escolher
          };
        });
      });
    }).catch(function () {
      return searchPlacesLocal(input);
    });
  }

  /* Converte uma sugestão em { label, coords }. */
  function resolvePlace(suggestion) {
    if (suggestion.coords) {
      return Promise.resolve({
        label: suggestion.main + (suggestion.secondary ? " - " + suggestion.secondary.split(",")[0] : ""),
        coords: suggestion.coords
      });
    }

    var pred = predictionCache[suggestion.id];

/* ============================================================
   FoodRadar — catálogo aberto (OpenStreetMap via Overpass API)
   ------------------------------------------------------------
   Cobre o Brasil inteiro sem chave e sem cartão. Entrega o que
   o OSM sabe: nome, tipo de cozinha, coordenada, e às vezes
   endereço, telefone e horário.

   NÃO entrega cardápio nem preço — esses continuam sendo dado
   próprio da plataforma. Um restaurante vindo daqui aparece
   marcado como "cardápio ainda não cadastrado".

   IMPORTANTE — política de uso:
   O Overpass é mantido por voluntários. Este arquivo só o
   consulta quando a região não tem NENHUM restaurante próprio
   cadastrado, guarda o resultado por 24h no localStorage e faz
   no máximo uma requisição por vez. Em produção o certo é rodar
   isso offline, uma vez, e gravar no seu banco — não do
   navegador de cada visitante.
   ============================================================ */
(function (global) {
  "use strict";

  /* Instâncias públicas com cobertura MUNDIAL, tentadas em ordem.
     São servidores voluntários e vivem sobrecarregados — quando um
     devolve 504 ou uma página de erro sem cabeçalho CORS, o navegador
     reporta "Failed to fetch"; por isso mais de um espelho.

     Atenção ao acrescentar espelhos: vários são REGIONAIS (o
     overpass.osm.ch, por exemplo, só tem a Suíça). Um espelho regional
     responde HTTP 200 com zero elementos, e o app conclui que não
     existe restaurante nenhum na região — pior que um erro. */
  var ENDPOINTS = [
    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter"
  ];

  var CACHE_PREFIX = "foodradar:osm:";
  var CACHE_TTL_MS = 24 * 60 * 60 * 1000;
  var inFlight = null;

  /* ---------- tradução de tags do OSM para o vocabulário do app ---------- */

  var CUISINE_TO_CATEGORY = {
    italian: "italiana", pizza: "pizza", pasta: "italiana",
    japanese: "japonesa", sushi: "japonesa", ramen: "japonesa", asian: "japonesa",
    burger: "hamburguer", american: "hamburguer", sandwich: "hamburguer",
    brazilian: "brasileira", regional: "brasileira", mineira: "brasileira",
    barbecue: "churrasco", steak_house: "churrasco", churrascaria: "churrasco",
    vegetarian: "vegetariana", vegan: "vegetariana", salad: "vegetariana",
    arab: "arabe", lebanese: "arabe", kebab: "arabe", turkish: "arabe",
    mexican: "mexicana", "tex-mex": "mexicana",
    seafood: "frutos-do-mar", fish: "frutos-do-mar",
    coffee_shop: "cafeteria", coffee: "cafeteria", breakfast: "cafeteria",
    cake: "doces", ice_cream: "doces", dessert: "doces", donut: "doces",
    bakery: "doces", chocolate: "doces"
  };

  var CUISINE_LABEL = {
    italiana: "Italiana", pizza: "Pizza", japonesa: "Japonesa",
    hamburguer: "Hambúrguer", brasileira: "Brasileira", churrasco: "Churrasco",
    vegetariana: "Vegetariana", arabe: "Árabe", mexicana: "Mexicana",
    "frutos-do-mar": "Frutos do mar", cafeteria: "Cafeteria", doces: "Doces"
  };

  var AMENITY_LABEL = {
    restaurant: "Restaurante",
    cafe: "Cafeteria",
    fast_food: "Lanchonete",
    bar: "Bar",
    ice_cream: "Sorveteria"
  };

  /* ---------- horário: formato OSM -> array de 7 dias do app ----------
     Cobre os padrões comuns ("Mo-Sa 10:00-22:00; Su 16:00-22:00",
     "Mo-Su 09:00-21:00", "24/7", "Tu-Fr 12:00-15:00,19:00-23:00").
     Qualquer coisa mais exótica devolve null e a UI mostra o texto cru. */

  var DAY_INDEX = { su: 0, mo: 1, tu: 2, we: 3, th: 4, fr: 5, sa: 6 };
  var DAY_ORDER = ["su", "mo", "tu", "we", "th", "fr", "sa"];

  function expandDays(token) {
    var out = [];
    var ok = true;

    token.split(",").forEach(function (part) {
      part = part.trim().toLowerCase();
      var range = part.split("-");

      if (range.length === 2) {
        var from = DAY_INDEX[range[0]], to = DAY_INDEX[range[1]];
        if (from === undefined || to === undefined) { ok = false; return; }
        for (var i = 0; i < 7; i++) {
          var d = (from + i) % 7;
          out.push(d);
          if (d === to) break;
        }
      } else {
        var single = DAY_INDEX[part];
        if (single === undefined) { ok = false; return; }   // PH, SH, etc.
        out.push(single);
      }
    });

    return ok && out.length ? out : null;
  }

  function padTime(t) {
    var p = t.split(":");
    return (p[0].length === 1 ? "0" + p[0] : p[0]) + ":" + p[1];
  }

  function parseOpeningHours(raw) {
    if (!raw) return null;
    var s = String(raw).trim();

    if (s === "24/7") {
      return [0, 1, 2, 3, 4, 5, 6].map(function () { return ["00:00-24:00"]; });
    }

    var week = [null, null, null, null, null, null, null];
    var matched = false;

    s.split(";").forEach(function (rule) {
      rule = rule.trim();
      if (!rule) return;

      var m = rule.match(/^([A-Za-z]{2}(?:\s*[-,]\s*[A-Za-z]{2})*)\s+(.+)$/);
      if (!m) return;

      var days = expandDays(m[1]);
      if (!days) return;                       // regra de feriado, ignora

      var timePart = m[2].trim();
      if (/^(off|closed)$/i.test(timePart)) {
        days.forEach(function (d) { week[d] = null; });
        matched = true;
        return;
      }

      var ranges = timePart.split(",")
        .map(function (t) { return t.trim(); })
        .filter(function (t) { return /^\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}$/.test(t); })
        .map(function (t) {
          var pair = t.split("-");
          return padTime(pair[0].trim()) + "-" + padTime(pair[1].trim());
        });

      if (!ranges.length) return;
      days.forEach(function (d) { week[d] = (week[d] || []).concat(ranges); });
      matched = true;
    });

    return matched ? week : null;
  }

  /* ---------- normalização de um elemento do Overpass ---------- */

  function buildAddress(tags) {
    var street = tags["addr:street"];
    var number = tags["addr:housenumber"];
    var suburb = tags["addr:suburb"] || tags["addr:neighbourhood"];
    var city = tags["addr:city"];
    var uf = tags["addr:state"];

    if (!street && !city) return "";

    var line = street ? (number ? street + ", " + number : street) : "";
    var tail = [suburb, city].filter(Boolean).join(", ");
    var out = [line, tail].filter(Boolean).join(" - ");
    return uf ? out + " - " + uf : out;
  }

  function toRestaurant(el) {
    var tags = el.tags || {};
    if (!tags.name) return null;

    var lat = el.lat != null ? el.lat : (el.center && el.center.lat);
    var lng = el.lon != null ? el.lon : (el.center && el.center.lon);
    if (lat == null || lng == null) return null;

    // cuisine pode vir como "pizza;italian" — pega o primeiro que conhecemos
    var categories = [];
    String(tags.cuisine || "").split(";").forEach(function (c) {
      var cat = CUISINE_TO_CATEGORY[c.trim().toLowerCase()];
      if (cat && categories.indexOf(cat) < 0) categories.push(cat);
    });
    if (!categories.length && tags.amenity === "cafe") categories.push("cafeteria");

    var cuisineLabel = categories.length
      ? CUISINE_LABEL[categories[0]]
      : (AMENITY_LABEL[tags.amenity] || "Restaurante");

    var facilities = [];
    if (tags.internet_access === "wlan" || tags.internet_access === "yes") facilities.push("wifi");
    if (tags.outdoor_seating === "yes") facilities.push("outdoor");
    if (tags.wheelchair === "yes") facilities.push("accessible");
    if (tags.air_conditioning === "yes") facilities.push("ac");
    if (tags["payment:cards"] === "yes" || tags["payment:credit_cards"] === "yes") facilities.push("cards");

    var highlights = [];
    if (tags.delivery === "yes") highlights.push("Delivery");
    if (tags.takeaway === "yes") highlights.push("Para viagem");
    if (tags.outdoor_seating === "yes") highlights.push("Área externa");
    if (tags.reservation === "yes") highlights.push("Aceita reserva");

    var hours = parseOpeningHours(tags.opening_hours);

    return {
      id: "osm-" + el.type.charAt(0) + el.id,
      source: "osm",
      name: tags.name,
      cuisine: cuisineLabel,
      categories: categories,
      rating: null,
      reviews: 0,
      priceLevel: 0,
      avgPerPerson: null,
      description: "",
      highlights: highlights,
      facilities: facilities,
      address: buildAddress(tags),
      city: null,
      coords: { lat: lat, lng: lng },
      placeId: "",
      phone: tags.phone || tags["contact:phone"] || "",
      website: tags.website || tags["contact:website"] || "",
      delivery: tags.delivery === "yes",
      reservation: tags.reservation === "yes",
      photo: "",
      hours: hours,
      hoursRaw: hours ? "" : (tags.opening_hours || ""),
      menu: []
    };
  }

  /* ---------- cache ---------- */

  function cacheKey(coords, radius) {
    return CACHE_PREFIX + coords.lat.toFixed(2) + "," + coords.lng.toFixed(2) + ":" + radius;
  }

  function readCache(key) {
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (Date.now() - parsed.t > CACHE_TTL_MS) { localStorage.removeItem(key); return null; }
      return parsed.list;
    } catch (e) { return null; }
  }

  function writeCache(key, list) {
    try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), list: list })); }
    catch (e) { /* cota cheia ou modo privado — segue sem cache */ }
  }

  /* ---------- consulta ---------- */

  function buildQuery(coords, radius) {
    var filter = '["amenity"~"^(restaurant|cafe|fast_food)$"]["name"]';
    var around = "(around:" + radius + "," + coords.lat + "," + coords.lng + ")";
    return "[out:json][timeout:25];(" +
      "node" + filter + around + ";" +
      "way" + filter + around + ";" +
      ");out center 60;";
  }

  function fetchFrom(endpoint, query) {
    var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = controller && setTimeout(function () { controller.abort(); }, 20000);

    return fetch(endpoint + "?data=" + encodeURIComponent(query), {
      signal: controller ? controller.signal : undefined
    }).then(function (res) {
      if (timer) clearTimeout(timer);
      if (!res.ok) throw new Error("http-" + res.status);
      return res.json();
    });
  }

  /* Tenta os espelhos em sequência; só desiste quando todos falham. */
  function fetchWithMirrors(query) {
    return ENDPOINTS.reduce(function (chain, endpoint) {
      return chain.catch(function () { return fetchFrom(endpoint, query); });
    }, Promise.reject(new Error("start")));
  }

  /**
   * Restaurantes reais num raio ao redor do ponto.
   * @param {{lat:number,lng:number}} coords
   * @param {number} radius metros (padrão 2500)
   * @returns {Promise<Array>} lista normalizada (pode vir vazia).
   *          Rejeita se nenhum espelho do Overpass respondeu.
   */
  function searchNearby(coords, radius) {
    radius = radius || 2500;

    var key = cacheKey(coords, radius);
    var cached = readCache(key);
    if (cached) return Promise.resolve(cached);

    if (inFlight) return inFlight;           // uma requisição por vez

    var query = buildQuery(coords, radius);

    inFlight = fetchWithMirrors(query)
      .then(function (data) {
        var list = (data.elements || [])
          .map(toRestaurant)
          .filter(Boolean);

        // sem duplicar nome no mesmo quarteirão
        var seen = {};
        list = list.filter(function (r) {
          var k = r.name.toLowerCase() + "|" + r.coords.lat.toFixed(3);
          if (seen[k]) return false;
          seen[k] = true;
          return true;
        });

        writeCache(key, list);
        inFlight = null;
        return list;
      })
      .catch(function (err) {
        inFlight = null;
        throw err;                           // quem chamou decide o que mostrar
      });

    return inFlight;
  }

  /**
   * Busca UM elemento pelo id ("osm-n123"). É o que faz um link
   * compartilhado funcionar em carregamento frio — sem isso, quem
   * abre a URL direto cai em "restaurante não encontrado", porque a
   * lista só existe depois de navegar pela home.
   */
  function fetchById(id) {
    var m = String(id).match(/^osm-([nwr])(\d+)$/);
    if (!m) return Promise.reject(new Error("id-invalido"));

    var kind = { n: "node", w: "way", r: "relation" }[m[1]];
    var query = "[out:json][timeout:25];" + kind + "(" + m[2] + ");out center 1;";

    return fetchWithMirrors(query).then(function (data) {
      var el = (data.elements || [])[0];
      var restaurant = el && toRestaurant(el);
      if (!restaurant) throw new Error("nao-encontrado");
      return restaurant;
    });
  }

  global.Osm = {
    searchNearby: searchNearby,
    fetchById: fetchById,
    parseOpeningHours: parseOpeningHours     // exposto para teste
  };
})(window);

  function openStatus(r, now) {

    var mins = now.getHours() * 60 + now.getMinutes();
    var prevDay = (day + 6) % 7;

    if (later) return { open: false, label: "Fechado · abre às " + later.open };
